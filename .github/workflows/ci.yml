name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      # 문서 규칙은 표준 library만으로 확인합니다. 설치보다 먼저 돌려서
      # dependency 설치가 실패해도 문서 위반은 알 수 있게 합니다.
      - name: 문서 규칙 검사
        run: python scripts/check_docs.py

      # requirements.txt가 자기 index URL(cu126)을 갖고 있으므로 그대로
      # 씁니다. CPU 전용 목록을 따로 두면 두 목록이 어긋납니다.
      - name: Dependency 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 저장소 root에서 `python -m pytest`로 실행해야 합니다. src가 설치된
      # package가 아니라서 맨 pytest는 import가 깨집니다.
      - name: Test
        run: python -m pytest -q --basetemp=artifacts/pytest-tmp

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/pipelines/web/frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/pipelines/web/frontend/package-lock.json

      - name: Dependency 설치
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
